name: Test Status
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    env:
      CI: true

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [lts/*]
        experimental: [false]
        include:
          - os: ubuntu-latest
            node-version: latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm update
      - run: npm ci
      - run: npm test
